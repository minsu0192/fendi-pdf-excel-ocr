<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="FENDI 과세가격 결정자료 공문 4~7페이지를 OCR로 엑셀 변환">
  <title>FENDI 공문 PDF 엑셀 추출기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">LOCAL OCR · FENDI FORM</div>
      <h1>공문 PDF를<br><span>검토 가능한 엑셀</span>로</h1>
      <p>과세가격 결정자료 제출 요청 공문의 4~7페이지를 브라우저에서 읽어 표로 변환합니다.</p>
      <div class="privacy">🔒 PDF와 결과는 외부 서버로 전송되지 않습니다</div>
    </header>

    <section class="panel">
      <label id="dropZone" class="drop-zone" for="pdfInput">
        <input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden>
        <div class="upload-mark">PDF</div>
        <strong>PDF를 끌어놓거나 클릭해서 선택</strong>
        <span>FENDI 공문 양식 · 기본 추출 범위 4~7페이지</span>
      </label>

      <div class="settings">
        <label>시작 페이지 <input id="startPage" type="number" min="1" value="4"></label>
        <label>종료 페이지 <input id="endPage" type="number" min="1" value="7"></label>
        <button id="runButton" class="primary" disabled>엑셀 추출 시작</button>
      </div>

      <div id="fileCard" class="file-card" hidden>
        <div><strong id="fileName"></strong><span id="fileMeta"></span></div>
        <button id="clearButton" type="button">삭제</button>
      </div>

      <section id="progressSection" class="progress" hidden>
        <div class="progress-head"><strong id="progressTitle">준비 중</strong><span id="progressPercent">0%</span></div>
        <div class="bar"><div id="progressBar"></div></div>
        <p id="progressDetail">OCR 모델을 불러오고 있습니다.</p>
      </section>

      <div id="errorBox" class="error" hidden></div>
    </section>

    <section id="resultSection" class="results" hidden>
      <div class="result-head">
        <div>
          <div class="eyebrow">EXTRACTION COMPLETE</div>
          <h2>추출 결과</h2>
        </div>
        <button id="downloadButton" class="primary">엑셀 다운로드</button>
      </div>
      <div class="stats">
        <article><span>추출 행</span><strong id="rowCount">0</strong></article>
        <article><span>검토 필요</span><strong id="reviewCount">0</strong></article>
        <article><span>처리 페이지</span><strong id="pageCount">0</strong></article>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr id="tableHeader"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <p class="notice">노란색 행은 OCR 신뢰도가 낮거나 번호 형식이 맞지 않으므로 원본과 대조하세요.</p>
    </section>

    <footer>Created by Minsu Bae · 브라우저 내 처리</footer>
  </main>
  <script src="extractor.js"></script>
  <script src="app.js"></script>
</body>
</html>
